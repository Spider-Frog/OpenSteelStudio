name: Release

# Every push to main (in practice: every merged pull request) is released: it gets the next
# version, a tarball, a .deb, an .rpm, an Arch package and an AppImage, and a v0.x.y tag.
# Every package is installed and started in a clean container before anything is published.
#
# Versions: the patch number goes up by one per release. To bump further (0.2.0, say), raise
# the version in Cargo.toml in the pull request; it is used when it's past the last release.
# Releases stay below 1.0 for now.
on:
  push:
    branches: [main]

permissions:
  contents: write

# One release at a time, so two quick merges can't claim the same version.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: next
        name: Work out the version
        run: |
          # Re-running the workflow for an already released commit keeps its version.
          current=$(git tag --points-at HEAD --list 'v*' | sort -V | tail -n 1)
          if [ -n "$current" ]; then
            version=${current#v}
          else
            latest=$(git tag --list 'v*' | sort -V | tail -n 1)
            cargo=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
            if [ -z "$latest" ]; then
              version=$cargo
            else
              IFS=. read -r major minor patch <<< "${latest#v}"
              version="$major.$minor.$((patch + 1))"
              # A version raised in Cargo.toml wins when it is higher.
              if [ "$(printf '%s\n%s\n' "$version" "$cargo" | sort -V | tail -n 1)" = "$cargo" ]; then
                version=$cargo
              fi
            fi
          fi
          case "$version" in
            0.*) ;;
            *) echo "Releases stay on 0.x for now, but the next version would be $version"; exit 1 ;;
          esac
          echo "Releasing $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Debian 13 ships GTK 4.18 and libadwaita 1.7 with an older glibc than rolling
  # distributions, so the tarball and AppImage built here run on most current systems.
  debian:
    needs: version
    runs-on: ubuntu-latest
    container: rust:1-trixie
    steps:
      - uses: actions/checkout@v5
      - name: Use version ${{ needs.version.outputs.version }}
        run: sed -i '0,/^version = .*/s//version = "${{ needs.version.outputs.version }}"/' Cargo.toml
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends pkg-config libgtk-4-dev libadwaita-1-dev fonts-dejavu-core
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release
      - run: cargo build --release
      - name: Tarball
        run: |
          name="open-steel-studio-v${{ needs.version.outputs.version }}-x86_64-linux"
          mkdir "$name"
          cp target/release/open-steel-studio README.md LICENSE data/70-open-steel-studio.rules "$name/"
          mkdir -p dist
          tar czf "dist/$name.tar.gz" "$name"
      - name: Debian package
        run: |
          cargo install cargo-deb --locked
          cargo deb --no-build --output dist/
      - uses: actions/upload-artifact@v5
        with:
          name: debian
          path: dist/

  appimage:
    needs: version
    runs-on: ubuntu-latest
    container: rust:1-trixie
    steps:
      - uses: actions/checkout@v5
      - name: Use version ${{ needs.version.outputs.version }}
        run: sed -i '0,/^version = .*/s//version = "${{ needs.version.outputs.version }}"/' Cargo.toml
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends pkg-config libgtk-4-dev libadwaita-1-dev \
            wget file desktop-file-utils libglib2.0-bin librsvg2-common
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          DEPLOY_GTK_VERSION: '4'
          LINUXDEPLOY_OUTPUT_VERSION: ${{ needs.version.outputs.version }}
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-gtk.sh
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --executable target/release/open-steel-studio \
            --desktop-file data/io.github.Spider_Frog.OpenSteelStudio.desktop \
            --icon-file data/icons/io.github.Spider_Frog.OpenSteelStudio.svg \
            --plugin gtk --output appimage
          mkdir -p dist
          mv OpenSteelStudio-*.AppImage "dist/open-steel-studio-v${{ needs.version.outputs.version }}-x86_64.AppImage"
      - uses: actions/upload-artifact@v5
        with:
          name: appimage
          path: dist/

  fedora:
    needs: version
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install build dependencies
        run: dnf install -y cargo rust gcc gtk4-devel libadwaita-devel dejavu-sans-fonts tar zstd
      - uses: actions/checkout@v5
      - name: Use version ${{ needs.version.outputs.version }}
        run: sed -i '0,/^version = .*/s//version = "${{ needs.version.outputs.version }}"/' Cargo.toml
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release
      - run: cargo build --release
      - name: RPM package
        run: |
          cargo install cargo-generate-rpm --locked
          mkdir -p dist
          cargo generate-rpm --output dist/
      - uses: actions/upload-artifact@v5
        with:
          name: fedora
          path: dist/

  arch:
    needs: version
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed base-devel rust gtk4 libadwaita ttf-dejavu
      - uses: actions/checkout@v5
      - name: Use version ${{ needs.version.outputs.version }}
        run: sed -i '0,/^version = .*/s//version = "${{ needs.version.outputs.version }}"/' Cargo.toml
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release
      - run: cargo build --release
      - name: Arch package
        run: |
          mkdir pkg
          cp packaging/arch/PKGBUILD packaging/arch/open-steel-studio.install pkg/
          cp target/release/open-steel-studio data/io.github.Spider_Frog.OpenSteelStudio.desktop \
            data/icons/io.github.Spider_Frog.OpenSteelStudio.svg data/70-open-steel-studio.rules \
            LICENSE README.md pkg/
          sed -i "s/^pkgver=.*/pkgver=${{ needs.version.outputs.version }}/" pkg/PKGBUILD
          useradd -m builder
          chown -R builder pkg
          su builder -c "cd pkg && makepkg --nodeps --noconfirm"
          mkdir -p dist
          cp pkg/*.pkg.tar.zst dist/
      - uses: actions/upload-artifact@v5
        with:
          name: arch
          path: dist/

  # Install each package in a clean container and start it. `--version` must report the
  # release's version; `--probe` loads every shared library the program needs, then looks
  # for the keyboard (there is none here).
  test-debian:
    needs: [version, debian]
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: debian
      - run: |
          apt-get update
          apt-get install -y ./open-steel-studio_*.deb
          open-steel-studio --version | grep -Fx "OpenSteelStudio ${{ needs.version.outputs.version }}"
          open-steel-studio --probe
          test -f /usr/lib/udev/rules.d/70-open-steel-studio.rules
          test -f /usr/share/applications/io.github.Spider_Frog.OpenSteelStudio.desktop

  test-tarball:
    needs: [version, debian]
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: debian
      - run: |
          apt-get update
          apt-get install -y --no-install-recommends libgtk-4-1 libadwaita-1-0
          tar xzf open-steel-studio-*.tar.gz
          ./open-steel-studio-*/open-steel-studio --version | grep -Fx "OpenSteelStudio ${{ needs.version.outputs.version }}"
          ./open-steel-studio-*/open-steel-studio --probe

  test-fedora:
    needs: [version, fedora]
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: fedora
      - run: |
          dnf install -y ./open-steel-studio-*.rpm
          open-steel-studio --version | grep -Fx "OpenSteelStudio ${{ needs.version.outputs.version }}"
          open-steel-studio --probe
          test -f /usr/lib/udev/rules.d/70-open-steel-studio.rules

  test-arch:
    needs: [version, arch]
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: arch
      - run: |
          pacman -Syu --noconfirm
          pacman -U --noconfirm ./open-steel-studio-*.pkg.tar.zst
          open-steel-studio --version | grep -Fx "OpenSteelStudio ${{ needs.version.outputs.version }}"
          open-steel-studio --probe
          test -f /usr/lib/udev/rules.d/70-open-steel-studio.rules

  # On another distribution than it was built on, with no GTK installed: everything GTK
  # needs has to come from inside the AppImage. The container only gets the libraries that
  # AppImages leave to the system on purpose (the AppImage "excludelist"), which every
  # desktop has: graphics drivers, X11/Wayland, fonts, text shaping and the like.
  test-appimage:
    needs: [version, appimage]
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: appimage
      - run: |
          dnf install -y --setopt=install_weak_deps=False \
            libstdc++ mesa-libGL mesa-libEGL mesa-libgbm libglvnd-glx libglvnd-egl libglvnd-opengl libdrm \
            libX11 libX11-xcb libxcb libwayland-client alsa-lib pipewire-libs fontconfig freetype harfbuzz \
            fribidi expat libcom_err libgpg-error libICE libSM libusb1 libuuid gmp
          chmod +x open-steel-studio-*.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 ./open-steel-studio-*.AppImage --version | grep -Fx "OpenSteelStudio ${{ needs.version.outputs.version }}"
          APPIMAGE_EXTRACT_AND_RUN=1 ./open-steel-studio-*.AppImage --probe

  publish:
    needs: [version, test-debian, test-tarball, test-fedora, test-arch, test-appimage]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: OpenSteelStudio ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
